name: Publish

on:
  push: {}

jobs:
  windows:
    name: "Publish: multiplatform, jvm, js, linux, mingw"
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 'Set Gradle project version'
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Clean
        if: ${{ false }} # Skip, since it fails on Windows: https://youtrack.jetbrains.com/issue/KT-50545/
        run: .\gradlew.bat clean

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .\gradlew.bat
          publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          publishJvmPublicationToGitHubPackagesRepository
          publishJsPublicationToGitHubPackagesRepository
          publishLinuxX64PublicationToGitHubPackagesRepository
          publishLinuxArm64PublicationToGitHubPackagesRepository
          publishMingwX64PublicationToGitHubPackagesRepository
          publishWasmJsPublicationToGitHubPackagesRepository
          publishWasmWasiPublicationToGitHubPackagesRepository

  macos:
    name: "Publish: macos, ios, watchos"
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 'Set Gradle project version'
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Clean
        run: ./gradlew clean

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          publishMacosArm64PublicationToGitHubPackagesRepository
          publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          publishWatchosSimulatorArm64PublicationToGitHubPackagesRepository
          publishWatchosArm32PublicationToGitHubPackagesRepository
          publishWatchosArm64PublicationToGitHubPackagesRepository
          publishTvosSimulatorArm64PublicationToGitHubPackagesRepository
          publishTvosArm64PublicationToGitHubPackagesRepository
          publishIosArm64PublicationToGitHubPackagesRepository
          publishWatchosDeviceArm64PublicationToGitHubPackagesRepository

  publish-kdoc:
    name: 'Publish KDoc'
    needs: [windows, macos]

    # Only publish KDoc for tagged versions
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Set Gradle project version'
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build KDoc
        run: ./gradlew dokkaGenerate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/dokka/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
